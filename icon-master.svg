<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="navy" x1="54" y1="30" x2="455" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17466d"/>
      <stop offset=".5" stop-color="#071b33"/>
      <stop offset="1" stop-color="#020a13"/>
    </linearGradient>
    <linearGradient id="maroon" x1="94" y1="342" x2="418" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a52e52"/>
      <stop offset=".55" stop-color="#7b1f3a"/>
      <stop offset="1" stop-color="#4f1128"/>
    </linearGradient>
    <linearGradient id="gold" x1="165" y1="392" x2="356" y2="465" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0a0"/>
      <stop offset=".48" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#d78c0a"/>
    </linearGradient>
    <radialGradient id="white" cx="37%" cy="25%" r="78%">
      <stop stop-color="#fff"/>
      <stop offset=".77" stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#cbd4db"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="20" y="20" width="472" height="472" rx="104"/>
    </clipPath>
    <clipPath id="portrait">
      <circle cx="256" cy="210" r="157"/>
    </clipPath>
    <pattern id="checks" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#fff8e8"/>
      <rect width="14" height="14" fill="#051426"/>
      <rect x="14" y="14" width="14" height="14" fill="#051426"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="plateShadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#071b33"/>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#navy)"/>

    <!-- Restrained race-day motion: school colors, no invented series marks. -->
    <path d="M-18 37 169-27l17 17L-6 61Z" fill="#7b1f3a"/>
    <path d="M-8 67 187-4l12 14L1 88Z" fill="#f7c948"/>
    <path d="M2 94 201 17l9 12L8 111Z" fill="#43b7e9"/>
    <path d="M401 20h130v114l-92-66Z" fill="url(#checks)" transform="skewX(-13)"/>

    <!-- The recognizable Fellowship Paladin mark stays dominant. -->
    <circle cx="256" cy="210" r="177" fill="#04101d" stroke="#f7c948" stroke-width="8" filter="url(#shadow)"/>
    <circle cx="256" cy="210" r="160" fill="url(#white)" stroke="#fff8e8" stroke-width="4"/>
    <g clip-path="url(#portrait)">
      <image href="fcs-paladin-head.gif" x="106" y="30" width="304" height="357" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <!-- One clean race-number plate. -->
    <g filter="url(#plateShadow)">
      <path d="M72 341 442 331 429 474 83 481Z" fill="url(#maroon)" stroke="#f7c948" stroke-width="7" stroke-linejoin="round"/>
      <path d="M93 356 421 348 418 385 91 392Z" fill="#57142b" opacity=".7"/>
      <path d="M89 448 430 441 427 470 87 477Z" fill="url(#checks)"/>
    </g>

    <g transform="skewX(-6)">
      <text x="125" y="389" fill="#fff8e8" font-family="Arial Narrow, Arial, sans-serif" font-size="27" font-style="italic" font-weight="900" letter-spacing="3">DAYTONA WORDS</text>
      <text x="166" y="462" fill="url(#gold)" font-family="Arial Black, Impact, sans-serif" font-size="105" font-style="italic" font-weight="900" letter-spacing="-8">1–50</text>
    </g>
  </g>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#f7c948" stroke-width="8"/>
  <rect x="31" y="31" width="450" height="450" rx="94" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
</svg>
